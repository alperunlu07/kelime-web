<!DOCTYPE html>
<html lang="tr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
	<meta http-equiv="Cache-Control" content="no-cache">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Kayıp Renkler">
	<meta name="theme-color" content="#1b3468">
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
	<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
	<title>Kayıp Renkler</title>
	<style>
		html, body { margin: 0; height: 100%; background: #1b3468; color: #fff; overflow: hidden; }
		body { display: flex; align-items: center; justify-content: center; font: 600 17px/1.4 system-ui, sans-serif; }
	</style>
</head>
<body>
	<div>Kayıp Renkler yükleniyor…</div>
	<script>
	// The game lives in an immutable, per-deploy folder (v/<id>/). This page
	// always asks the server which build is current (no-store), so a phone
	// never stays on a stale build.
	(function () {
		var params = new URLSearchParams(location.search);
		params.delete("r");
		var q = params.toString();
		q = q ? "?" + q : "";
		function go(id) { location.replace("v/" + id + "/" + q); }
		fetch("version.json?t=" + Date.now(), { cache: "no-store" })
			.then(function (r) { if (!r.ok) { throw new Error(r.status); } return r.json(); })
			.then(function (v) { go(v.id); })
			.catch(function () { go("20261024-000911-752524c"); });
	})();
	</script>
</body>
</html>
